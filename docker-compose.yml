      - $RDNS_HOME/rdns.py:/rdns/src/rdns.py 
      - $RDNS_HOME/godns/dns.go:/rdns/src/dns.go
    networks:
      - cg2_net
  cg3:
    image: rdns:ovpn
    privileged: true
    volumes:
      - $RDNS_HOME/vpn_configs/ch-3/:/vpn_config
      - $RDNS_HOME/docs/resolv.conf:/resolv.conf
      - $RDNS_HOME/rdns.py:/rdns/src/rdns.py 
      - $RDNS_HOME/godns/dns.go:/rdns/src/dns.go      
    networks:
      - cg3_net
  cg4:
    image: rdns:ovpn
    privileged: true
    volumes:
      - $RDNS_HOME/vpn_configs/ch-4:/vpn_config
      - $RDNS_HOME/docs/resolv.conf:/resolv.conf
      - $RDNS_HOME/rdns.py:/rdns/src/rdns.py 
